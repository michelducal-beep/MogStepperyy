/* ============================================================
   MOGSTEPPERY — ULEPSZONE CSS PANELI
   Nowoczesny, czysty design z doskonałym rozmieszczeniem
   ============================================================ */

:root {
  --slider-pos: 50%;
  --primary-yellow: #FFC107;
  --dark-bg: #0a0a0a;
  --text-light: #ffffff;
  --text-gray: #999999;
  --border-color: #1a1a1a;
  --accent-green: #5fd76a;
  --accent-orange: #ffb020;
}

/* ============================================================
   TOP BAR — PASKA PROMOCYJNEGO
   ============================================================ */
#mog-top-bar-injected {
  position: sticky;
  top: 0;
  z-index: 10001;
  width: 100%;
  box-sizing: border-box;
  background: linear-gradient(90deg, #FFC107, #FFE082, #FFC107);
  background-size: 200% 100%;
  animation: mogBarShift 5s linear infinite;
  color: #000;
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 13px;
  padding: 12px 16px;
  text-align: center;
  box-shadow: 0 4px 12px rgba(255, 193, 7, 0.15);
}

@keyframes mogBarShift {
  0% { background-position: 0% 0; }
  100% { background-position: 200% 0; }
}

.mog-top-bar-track-injected {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 12px;
  max-width: 1200px;
  margin: 0 auto;
}

.mog-top-bar-sep-injected {
  opacity: 0.6;
  font-weight: 500;
}

@media (max-width: 768px) {
  #mog-top-bar-injected {
    font-size: 12px;
    padding: 10px 12px;
  }
  .mog-top-bar-track-injected {
    gap: 8px;
  }
}

@media (max-width: 480px) {
  #mog-top-bar-injected {
    font-size: 11px;
    padding: 8px 10px;
  }
  .mog-top-bar-track-injected {
    gap: 6px;
  }
}

/* ============================================================
   GÓRNY PRZYCISK "KUP TERAZ"
   ============================================================ */
#mog-top-quickbuy-injected {
  display: flex;
  justify-content: center;
  padding: 14px 16px;
  background: var(--dark-bg);
  border-bottom: 1px solid var(--border-color);
}

#mog-top-quickbuy-btn-injected {
  background: linear-gradient(135deg, var(--primary-yellow), #FFD54F);
  color: #000;
  border: none;
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 14px;
  padding: 12px 28px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 4px 16px rgba(255, 193, 7, 0.2);
  letter-spacing: 0.3px;
}

#mog-top-quickbuy-btn-injected:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(255, 193, 7, 0.35);
  background: linear-gradient(135deg, #FFD54F, var(--primary-yellow));
}

#mog-top-quickbuy-btn-injected:active {
  transform: translateY(0);
  box-shadow: 0 2px 8px rgba(255, 193, 7, 0.2);
}

@media (max-width: 480px) {
  #mog-top-quickbuy-injected {
    padding: 10px 12px;
  }
  #mog-top-quickbuy-btn-injected {
    font-size: 13px;
    padding: 10px 20px;
  }
}

/* ============================================================
   KOMUNIKAT O STANIE MAGAZYNOWYM
   ============================================================ */
.mog-stock-notice-injected {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: var(--accent-orange);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 600;
  background: linear-gradient(135deg, rgba(255, 176, 32, 0.12), rgba(255, 176, 32, 0.05));
  border: 1.5px solid rgba(255, 176, 32, 0.35);
  border-radius: 14px;
  padding: 12px 20px;
  max-width: 100%;
  margin: 0 auto 20px;
  text-align: center;
  box-shadow: 0 4px 12px rgba(255, 176, 32, 0.08);
  animation: pulseNotice 2.5s ease-in-out infinite;
}

@keyframes pulseNotice {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.85; }
}

.mog-stock-notice-injected svg {
  flex-shrink: 0;
  animation: blink 1s ease-in-out infinite;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

@media (max-width: 480px) {
  .mog-stock-notice-injected {
    font-size: 12px;
    padding: 10px 16px;
    margin: 0 auto 16px;
  }
}

/* ============================================================
   SELEKTOR PAKIETÓW
   ============================================================ */
.mog-selector-wrap-injected {
  max-width: 100%;
  width: 100%;
  margin: 0 auto 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  font-family: 'Space Grotesk', sans-serif;
  padding: 0 16px;
  box-sizing: border-box;
}

.mog-selector-label-injected {
  color: var(--text-light);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 700;
  text-align: center;
  margin-bottom: 4px;
}

.mog-selector-grid-injected {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  max-width: 600px;
  margin: 0 auto;
  width: 100%;
}

.mog-option-injected {
  position: relative;
  background: linear-gradient(135deg, #141414, #0f0f0f);
  border: 1.5px solid var(--border-color);
  border-radius: 16px;
  padding: 22px 16px 18px;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  text-align: center;
  box-sizing: border-box;
  overflow: hidden;
}

.mog-option-injected::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255, 193, 7, 0.05), transparent);
  opacity: 0;
  transition: opacity 0.25s ease;
  pointer-events: none;
}

.mog-option-injected:hover {
  border-color: rgba(255, 193, 7, 0.6);
  box-shadow: 0 8px 24px rgba(255, 193, 7, 0.1);
  transform: translateY(-2px);
}

.mog-option-injected:hover::before {
  opacity: 1;
}

.mog-option-injected.mog-active-injected {
  border-color: var(--primary-yellow);
  background: linear-gradient(135deg, rgba(255, 193, 7, 0.1), rgba(255, 193, 7, 0.05));
  box-shadow: 0 0 0 1px var(--primary-yellow) inset, 0 12px 32px rgba(255, 193, 7, 0.15);
}

.mog-option-badge-injected {
  position: absolute;
  top: -12px;
  left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(135deg, var(--primary-yellow), #FFD54F);
  color: #000;
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 5px 12px;
  border-radius: 12px;
  white-space: nowrap;
  box-shadow: 0 4px 12px rgba(255, 193, 7, 0.3);
}

.mog-option-name-injected {
  color: var(--text-light);
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 8px;
  letter-spacing: 0.2px;
}

.mog-option-oldprice-injected {
  color: var(--text-gray);
  font-size: 12px;
  text-decoration: line-through;
  opacity: 0.8;
}

.mog-option-price-injected {
  color: var(--primary-yellow);
  font-size: 24px;
  font-weight: 800;
  line-height: 1.2;
  margin: 8px 0;
  letter-spacing: -0.5px;
}

.mog-option-save-injected {
  color: var(--accent-green);
  font-size: 11px;
  font-weight: 700;
  margin-top: 6px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

.mog-option-perks-injected {
  color: var(--text-gray);
  font-size: 11px;
  margin-top: 10px;
  line-height: 1.6;
  font-family: 'Inter', sans-serif;
}

@media (max-width: 768px) {
  .mog-selector-grid-injected {
    gap: 12px;
  }
  .mog-option-injected {
    padding: 18px 14px 14px;
  }
}

@media (max-width: 480px) {
  .mog-selector-wrap-injected {
    padding: 0 12px;
    gap: 10px;
  }
  .mog-selector-grid-injected {
    gap: 10px;
  }
  .mog-option-injected {
    padding: 16px 12px 12px;
  }
  .mog-option-name-injected {
    font-size: 13px;
  }
  .mog-option-price-injected {
    font-size: 20px;
  }
}

/* ============================================================
   BLOK PANELI DOSTARCZANY POD NATYWNYM PANELEM SPRZEDAŻY
   ============================================================ */
.mog-panels-anchor-injected {
  width: 100%;
  box-sizing: border-box;
  padding: 20px 16px;
  background: var(--dark-bg);
  border-top: 1px solid var(--border-color);
  border-bottom: 1px solid var(--border-color);
}

/* ============================================================
   WIZUALIZACJA E-BOOKA
   ============================================================ */
.mog-ebook-mockup-injected {
  display: flex;
  align-items: center;
  gap: 18px;
  max-width: 600px;
  margin: 18px auto;
  background: linear-gradient(135deg, #141414, #0f0f0f);
  border: 1.5px solid var(--border-color);
  border-radius: 18px;
  padding: 20px;
  box-sizing: border-box;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
}

.mog-ebook-device-injected {
  flex-shrink: 0;
  width: 72px;
  height: 100px;
  border-radius: 10px;
  background: linear-gradient(145deg, #1e1e1e, #000);
  border: 1.5px solid rgba(255, 193, 7, 0.2);
  transform: perspective(800px) rotateY(-18deg) rotateX(2deg);
  box-shadow: 16px 16px 32px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 193, 7, 0.15) inset;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.mog-ebook-device-screen-injected {
  position: absolute;
  inset: 7px;
  border-radius: 6px;
  background: linear-gradient(160deg, #1c1c1c, #0a0a0a);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.mog-ebook-pdf-badge-injected {
  background: var(--primary-yellow);
  color: #000;
  font-size: 8px;
  font-weight: 800;
  padding: 2px 6px;
  border-radius: 4px;
  letter-spacing: 0.4px;
  font-family: 'Space Grotesk', sans-serif;
}

.mog-ebook-icon-lines-injected {
  width: 32px;
  height: 2px;
  background: #333;
  border-radius: 2px;
}

.mog-ebook-text-injected {
  flex: 1;
  text-align: left;
}

.mog-ebook-title-injected {
  color: var(--text-light);
  font-weight: 700;
  font-size: 14px;
  margin-bottom: 4px;
  font-family: 'Space Grotesk', sans-serif;
  letter-spacing: 0.2px;
}

.mog-ebook-desc-injected {
  color: var(--text-gray);
  font-size: 12px;
  font-family: 'Inter', sans-serif;
  line-height: 1.5;
}

.mog-ebook-tag-injected {
  display: inline-block;
  margin-top: 8px;
  color: var(--primary-yellow);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  font-family: 'Space Grotesk', sans-serif;
}

@media (max-width: 480px) {
  .mog-ebook-mockup-injected {
    gap: 14px;
    padding: 16px;
    margin: 14px auto;
  }
  .mog-ebook-device-injected {
    width: 64px;
    height: 88px;
  }
  .mog-ebook-title-injected {
    font-size: 13px;
  }
  .mog-ebook-desc-injected {
    font-size: 11px;
  }
}

/* ============================================================
   FINALNY BOX ZAKUPOWY
   ============================================================ */
.mog-final-box-injected {
  max-width: 600px;
  margin: 16px auto;
  background: linear-gradient(135deg, #141414, #0f0f0f);
  border: 1.5px solid var(--primary-yellow);
  border-radius: 18px;
  padding: 24px 22px;
  text-align: center;
  box-sizing: border-box;
  box-shadow: 0 12px 32px rgba(255, 193, 7, 0.12);
}

.mog-final-pricerow-injected {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 12px;
  margin-bottom: 6px;
  flex-wrap: wrap;
}

.mog-final-oldprice-injected {
  color: var(--text-gray);
  font-size: 16px;
  text-decoration: line-through;
  font-family: 'Space Grotesk', sans-serif;
  opacity: 0.8;
}

.mog-final-newprice-injected {
  color: var(--primary-yellow);
  font-size: 32px;
  font-weight: 800;
  font-family: 'Space Grotesk', sans-serif;
  letter-spacing: -0.5px;
}

.mog-final-percent-injected {
  background: linear-gradient(135deg, #ff3b30, #ff5a52);
  color: #fff;
  font-size: 11px;
  font-weight: 800;
  padding: 4px 10px;
  border-radius: 8px;
  font-family: 'Space Grotesk', sans-serif;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

.mog-final-shipping-injected {
  color: var(--accent-green);
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin: 16px 0 18px;
  font-family: 'Space Grotesk', sans-serif;
}

.mog-final-bullets-injected {
  list-style: none;
  padding: 0;
  margin: 0;
  text-align: left;
  display: inline-flex;
  flex-direction: column;
  gap: 10px;
}

.mog-final-bullets-injected li {
  color: var(--text-light);
  font-size: 13px;
  font-family: 'Inter', sans-serif;
  display: flex;
  align-items: center;
  gap: 10px;
  letter-spacing: 0.2px;
}

.mog-final-bullets-injected li svg {
  color: var(--accent-green);
  flex-shrink: 0;
  width: 18px;
  height: 18px;
}

@media (max-width: 480px) {
  .mog-final-box-injected {
    padding: 18px 16px;
    margin: 12px auto;
  }
  .mog-final-newprice-injected {
    font-size: 28px;
  }
  .mog-final-shipping-injected {
    font-size: 12px;
    margin: 14px 0 16px;
  }
  .mog-final-bullets-injected li {
    font-size: 12px;
  }
}

/* ============================================================
   PRZYCISK ZAKUPU
   ============================================================ */
.mog-final-box-injected button.cta {
  background: linear-gradient(135deg, var(--primary-yellow), #FFD54F) !important;
  color: #000 !important;
  border: none !important;
  font-size: 15px !important;
  font-weight: 700 !important;
  padding: 14px 28px !important;
  border-radius: 14px !important;
  cursor: pointer !important;
  text-align: center !important;
  font-family: 'Space Grotesk', sans-serif !important;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
  box-shadow: 0 8px 24px rgba(255, 193, 7, 0.25) !important;
  letter-spacing: 0.3px !important;
  margin-bottom: 16px !important;
  width: 100% !important;
  display: block !important;
}

.mog-final-box-injected button.cta:hover {
  transform: translateY(-2px) !important;
  box-shadow: 0 12px 32px rgba(255, 193, 7, 0.35) !important;
  background: linear-gradient(135deg, #FFD54F, var(--primary-yellow)) !important;
}

.mog-final-box-injected button.cta:active {
  transform: translateY(0) !important;
  box-shadow: 0 4px 12px rgba(255, 193, 7, 0.2) !important;
}

@media (max-width: 480px) {
  .mog-final-box-injected button.cta {
    font-size: 14px !important;
    padding: 12px 20px !important;
    margin-bottom: 14px !important;
  }
}

/* ============================================================
   LIVE SALES POPUPS (TOASTY)
   ============================================================ */
#mog-toast-container-injected {
  position: fixed;
  left: 16px;
  bottom: 16px;
  z-index: 9998;
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-width: 320px;
  pointer-events: none;
}

.mog-toast-injected {
  background: linear-gradient(135deg, #141414, #0f0f0f);
  border: 1px solid var(--border-color);
  border-left: 3px solid var(--primary-yellow);
  border-radius: 14px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
  font-family: 'Inter', sans-serif;
  opacity: 0;
  transform: translateY(20px) translateX(-20px);
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  pointer-events: auto;
}

.mog-toast-injected.mog-toast-show-injected {
  opacity: 1;
  transform: translateY(0) translateX(0);
}

.mog-toast-avatar-injected {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(255, 193, 7, 0.15);
  border: 1.5px solid rgba(255, 193, 7, 0.35);
  color: var(--primary-yellow);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 14px;
  flex-shrink: 0;
  font-family: 'Space Grotesk', sans-serif;
}

.mog-toast-text-injected {
  font-size: 12px;
  color: var(--text-light);
  line-height: 1.5;
}

.mog-toast-text-injected b {
  color: var(--primary-yellow);
  font-weight: 700;
}

.mog-toast-time-injected {
  color: var(--text-gray);
  font-size: 10px;
  margin-top: 2px;
}

.mog-toast-close-injected {
  position: absolute;
  top: 8px;
  right: 10px;
  color: var(--text-gray);
  font-size: 12px;
  cursor: pointer;
  background: none;
  border: none;
  transition: color 0.2s ease;
}

.mog-toast-close-injected:hover {
  color: var(--primary-yellow);
}

@media (max-width: 480px) {
  #mog-toast-container-injected {
    left: 10px;
    right: 10px;
    bottom: 10px;
    max-width: none;
  }
  .mog-toast-injected {
    padding: 12px 14px;
  }
}

/* ============================================================
   ANIMACJA WEJŚCIA
   ============================================================ */
.mog-reveal-injected {
  opacity: 0;
  transform: translateY(16px);
  transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

.mog-reveal-injected.mog-reveal-visible-injected {
  opacity: 1;
  transform: translateY(0);
}

/* ============================================================
   PANEL CTA (CALL-TO-ACTION)
   ============================================================ */
#cro-cta-panel-injected {
  max-width: 100%;
  width: 100%;
  margin: 24px auto 0;
  background: linear-gradient(135deg, #141414, #0f0f0f);
  border: 1.5px solid var(--border-color);
  border-radius: 16px;
  padding: 14px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  overflow: hidden;
  box-sizing: border-box;
}

#cro-cta-panel-injected:hover {
  transform: translateY(-2px);
  border-color: var(--primary-yellow);
  box-shadow: 0 12px 32px rgba(255, 193, 7, 0.15);
}

#cro-cta-panel-injected:active {
  transform: translateY(0);
  box-shadow: 0 4px 12px rgba(255, 193, 7, 0.1);
}

.cro-cta-panel-tag-injected {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  max-width: 100%;
  overflow: hidden;
  color: var(--primary-yellow);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: 8px;
  line-height: 1;
  box-sizing: border-box;
}

.cro-cta-panel-tag-injected svg {
  color: var(--primary-yellow) !important;
  animation: slideLeft 1.5s infinite !important;
  width: 9px !important;
  height: 9px !important;
  min-width: 9px !important;
  min-height: 9px !important;
  max-width: 9px !important;
  max-height: 9px !important;
  flex-shrink: 0 !important;
  display: block !important;
}

@keyframes slideLeft {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(-6px); }
}
