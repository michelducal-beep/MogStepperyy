/* =========================================================

   Właściwe centrowanie robi skrypt na dole strony (runtime),

  justify-content: center;
  gap: 8px;
}
.instruction-text-injected svg {
  animation: slideLeft 1.5s infinite;
}
@keyframes slideLeft {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(-5px); }
}
.comparison-slider-injected {
  position: relative;
  width: 100%;
  aspect-ratio: 412 / 1024;
  overflow: hidden;
  border-radius: 24px;
  box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8);
  cursor: ew-resize;
  user-select: none;
  border: 1px solid var(--border-color);
  background: #111;
  touch-action: none;
}
.comparison-slider-injected .image-injected {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}
.before-image-injected {
  z-index: 2;
  clip-path: inset(0 calc(100% - var(--slider-pos)) 0 0);
}
.after-image-injected {
  z-index: 1;
}
.slider-divider-injected {
  position: absolute;
  top: 0;
  bottom: 0;
  left: var(--slider-pos);
  width: 4px;
  background-color: var(--primary-yellow);
  z-index: 3;
  transform: translateX(-50%);
  box-shadow: 0 0 15px rgba(255, 193, 7, 0.5);
}
.slider-handle-injected {
  position: absolute;
  top: 50%;
  left: var(--slider-pos);
  transform: translate(-50%, -50%);
  width: 52px;
  height: 52px;
  background-color: var(--primary-yellow);
  border-radius: 50%;
  z-index: 4;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 30px rgba(255, 193, 7, 0.7);
  pointer-events: none;
}
.slider-handle-injected::before, .slider-handle-injected::after {
  content: '';
  width: 0; height: 0;
  border-top: 7px solid transparent;
  border-bottom: 7px solid transparent;
}
.slider-handle-injected::before { border-right: 10px solid #000; margin-right: 4px; }
.slider-handle-injected::after { border-left: 10px solid #000; margin-left: 4px; }
.label-injected {
  position: absolute;
  bottom: 30px;
  padding: 10px 18px;
  background: rgba(0, 0, 0, 0.8);
  color: var(--text-light);
  font-weight: 700;
  border-radius: 12px;
  font-size: 12px;
  z-index: 5;
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.1);

  pointer-events: none;
}
.label-before-injected { left: 20px; opacity: 0.9; }
.label-after-injected { right: 20px; opacity: 0.9; }
.label-highlight-injected { color: var(--primary-yellow); }
.comparison-slider-injected:not(.sliding) .before-image-injected,
.comparison-slider-injected:not(.sliding) .slider-divider-injected,
.comparison-slider-injected:not(.sliding) .slider-handle-injected {
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

<script>
(function() {
  const img_przed = "przed7cm.png";
  const img_po = "po7cm.png";

  const sliderHTML = `
  <section class="transformation-section-injected" id="injected-slider-section">
    <div class="transformation-container-injected">
      <h2 class="transformation-title-injected">Zobacz różnicę na demo</h2>
      <p class="transformation-subtitle-injected">Porównanie sylwetki bez wkładek i z MogSteppery</p>
      <div class="slider-buttons-injected">
        <button class="btn-injected" id="btn-before">Bez wkładek</button>
        <button class="btn-injected" id="btn-after">Po +7 cm</button>
      </div>
      <div class="instruction-text-injected">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Przesuń suwak, aby porównać
      </div>
      <div class="comparison-slider-injected" id="slider-root-injected">
        <div class="image-injected after-image-injected" style="background-image: url('${img_po}')"></div>
        <div class="image-injected before-image-injected" style="background-image: url('${img_przed}')"></div>
        <div class="slider-divider-injected"></div>
        <div class="slider-handle-injected"></div>
        <div class="label-injected label-before-injected">Bez wkładek</div>
        <div class="label-injected label-after-injected">Po <span class="label-highlight-injected">+7CM</span></div>
      </div>
    </div>
  </section>
  `;

  function doInjection() {
    const checkAndInject = () => {
      if (document.getElementById('injected-slider-section')) return;
      const allElements = Array.from(document.querySelectorAll('section, div'));
      let target = null;
      for (let el of allElements) {
        if (el.textContent.includes('KORZYŚCI') || el.textContent.includes('Przemyślane od początku')) {
          target = el.closest('section') || el.parentElement;
          break;
        }
      }
      if (!target) {
        const sections = document.querySelectorAll('section');
        if (sections.length > 0) {
          target = sections[Math.floor(sections.length / 2)];
        }
      }
      if (target) {
        target.insertAdjacentHTML('afterend', sliderHTML);
        setupSlider();
      }
    };
    const interval = setInterval(checkAndInject, 500);
    setTimeout(() => clearInterval(interval), 5000);
  }

  function setupSlider() {
    const s = document.getElementById('slider-root-injected');
    const btnBefore = document.getElementById('btn-before');
    const btnAfter = document.getElementById('btn-after');
    if (!s) return;

    const setPos = (p) => {
      s.style.setProperty('--slider-pos', p + '%');
      if (p >= 90) { btnBefore.classList.add('active'); btnAfter.classList.remove('active'); }
      else if (p <= 10) { btnAfter.classList.add('active'); btnBefore.classList.remove('active'); }
      else { btnBefore.classList.remove('active'); btnAfter.classList.remove('active'); }
    };

    const update = (e) => {
      const r = s.getBoundingClientRect();
      const clientX = (e.touches ? e.touches[0].clientX : e.clientX);
      let p = ((clientX - r.left) / r.width) * 100;
      p = Math.max(0, Math.min(p, 100));
      setPos(p);
    };

    const start = (e) => {
      s.classList.add('sliding');
      update(e);
      const moveHandler = (moveEvent) => { update(moveEvent); };
      const endHandler = () => {
        s.classList.remove('sliding');
        window.removeEventListener('mousemove', moveHandler);
        window.removeEventListener('mouseup', endHandler);
        window.removeEventListener('touchmove', moveHandler);
        window.removeEventListener('touchend', endHandler);
      };
      window.addEventListener('mousemove', moveHandler);
      window.addEventListener('mouseup', endHandler);
      window.addEventListener('touchmove', moveHandler, { passive: false });
      window.addEventListener('touchend', endHandler);
    };

    s.addEventListener('mousedown', start);
    s.addEventListener('touchstart', (e) => { e.preventDefault(); start(e); }, { passive: false });
    btnBefore.addEventListener('click', () => setPos(100));
    btnAfter.addEventListener('click', () => setPos(0));
    setPos(50);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', doInjection);
  } else {
    doInjection();
  }
})();
</script>

      slider.insertAdjacentHTML('afterend', testimonialsHTML);
    }
  }

  const chainInterval = setInterval(insertChain, 500);
  setTimeout(() => clearInterval(chainInterval), 8000);


  /* ---------------- 8. UKRYCIE STARYCH PANELI 01/02/03/04 (zmodernizowanych) ---------------- */
  const NATIVE_PANEL_LABELS = ['TECHNOLOGIA', 'KORZYŚCI', 'PRODUKT', 'OPINIE'];
  window.__mogNativeImages = window.__mogNativeImages || {};

  function findImageInBlock(block) {
    if (!block) return null;
    const img = block.querySelector('img');
    if (img && img.src) return img.src;
    const all = block.querySelectorAll('*');
    for (const node of all) {
      const bg = getComputedStyle(node).backgroundImage;
      if (bg && bg !== 'none') {
        const m = bg.match(/url\(["']?(.*?)["']?\)/);
        if (m && m[1]) return m[1];
      }
    }
    return null;
  }

  function getBlockAncestor(el) {
    let node = el;
    let depth = 0;
    while (node && node.parentElement && depth < 12) {
      node = node.parentElement;
      depth++;
      if (node.tagName === 'SECTION') return node;
      if (node.parentElement && (node.parentElement.id === 'root' || node.parentElement.tagName === 'BODY' || node.parentElement.tagName === 'MAIN')) {
        return node;
      }
    }
    return el.parentElement;
  }

  function hideNativeDuplicateSections() {
    const candidates = document.querySelectorAll('span, div, p, h1, h2, h3, h4, h5');
    candidates.forEach((el) => {
      if (el.children.length !== 0) return;
      if (el.closest('[id*="injected"]') || el.closest('[class*="injected"]')) return;
      const txt = el.textContent.trim().toUpperCase();
      if (!NATIVE_PANEL_LABELS.includes(txt)) return;
      const block = getBlockAncestor(el);
      if (!block || block.dataset.mogHiddenByInjected) return;
      const imgUrl = findImageInBlock(block);
      if (imgUrl) window.__mogNativeImages[txt] = imgUrl;
      block.dataset.mogHiddenByInjected = 'true';
      block.style.display = 'none';
    });
  }

  const hideNativeInterval = setInterval(hideNativeDuplicateSections, 500);
  setTimeout(() => clearInterval(hideNativeInterval), 9000);


  /* ---------------- 9. WSTAWIENIE PRZECHWYCONYCH ZDJĘĆ W NOWE MIEJSCA ---------------- */
  function fillCapturedVisuals() {
    const techUrl = window.__mogNativeImages['TECHNOLOGIA'];
    const techSlot = document.getElementById('cro-tech-visual-slot-injected');
    if (techUrl && techSlot && !techSlot.dataset.filled) {
      techSlot.innerHTML = `<img src="${techUrl}" alt="Warstwy MogSteppery — regulacja 3-7 cm" loading="lazy" />`;
      techSlot.style.display = 'block';
      techSlot.dataset.filled = 'true';
    }
    const prodUrl = window.__mogNativeImages['PRODUKT'];
    const prodSlot = document.getElementById('cro-product-visual-slot-injected');
    if (prodUrl && prodSlot && !prodSlot.dataset.filled) {
      prodSlot.innerHTML = `<img src="${prodUrl}" alt="Wkładka MogSteppery" loading="lazy" />`;
      prodSlot.style.display = 'block';
      prodSlot.dataset.filled = 'true';
    }
  }

  const fillVisualsInterval = setInterval(fillCapturedVisuals, 500);
  setTimeout(() => clearInterval(fillVisualsInterval), 10000);


  /* ---------------- 10. PODPIĘCIE LINKÓW NAV "OPINIE" / "PRODUKT" DO SEKCJI ----------------
     W górnym panelu znajdują się natywne etykiety "Opinie" i "Produkt". Wyszukujemy je
     heurystycznie (krótki, samodzielny tekst w klikalnym elemencie) i podpinamy płynne
     przewijanie do odpowiednich wstrzykniętych sekcji.
  ---------------------------------------------------------------------------- */
  const NAV_TARGETS = [
    { match: /^opinie$/i, targetId: 'cro-testimonials-injected' },
    { match: /^produkt$/i, targetId: 'cro-size-info-injected' },
  ];

  function bindNavLinks() {
    const candidates = document.querySelectorAll('a, button, span, div, li');
    candidates.forEach((el) => {
      if (el.children.length !== 0) return;
      if (el.closest('[id*="injected"]') || el.closest('[class*="injected"]')) return;
      if (el.dataset.mogNavBound) return;
      const txt = el.textContent.trim();
      const rule = NAV_TARGETS.find(r => r.match.test(txt));
      if (!rule) return;

      const clickableEl = el.closest('a, button') || el;
      clickableEl.classList.add('mog-nav-bound-injected');
      el.dataset.mogNavBound = 'true';
      clickableEl.addEventListener('click', (e) => {
        const target = document.getElementById(rule.targetId);
        if (target) {
          e.preventDefault();
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });
    });
  }

  const navBindInterval = setInterval(bindNavLinks, 500);
  setTimeout(() => clearInterval(navBindInterval), 9000);

})();

  function openDoc(key) {
    const doc = DOCS[key];
    if (!doc) return;
    const content = document.getElementById('injected-legal-content');
    content.innerHTML = `<h2>${doc.title}</h2>${doc.html}`;
    document.getElementById('injected-legal-overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeDoc() {
    document.getElementById('injected-legal-overlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  function ensureOverlay() {
    if (document.getElementById('injected-legal-overlay')) return;
    document.body.insertAdjacentHTML('beforeend', overlayHTML);
    document.getElementById('injected-legal-close').addEventListener('click', closeDoc);
    document.getElementById('injected-legal-overlay').addEventListener('click', (e) => {
      if (e.target.id === 'injected-legal-overlay') closeDoc();
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDoc(); });
  }

  function addSellerTrustAndLegalBar() {
    if (!document.getElementById('injected-seller-trust')) {
      document.body.insertAdjacentHTML('beforeend', sellerTrustHTML);

      document.querySelectorAll('#injected-legal-bar .legal-extra-link-injected').forEach(btn => {
        btn.addEventListener('click', () => openDoc(btn.getAttribute('data-doc')));
      });
    }
  }

  function inject() {

    addSellerTrustAndLegalBar();
  }

     Ten skrypt WYŁĄCZNIE loguje do konsoli, niczego nie zmienia

============================================================ -->
<script>
(function () {
  window.addEventListener('load', function () {
    setTimeout(function () {
      document.querySelectorAll('*').forEach((el) => {
        if (el.children.length === 0 && /bestseller/i.test(el.textContent || '')) {
          console.log('Znaleziono element z tekstem "Bestseller":', el, 'klasa:', el.className, 'id:', el.id);
        }
      });
    }, 1500);
  });
})();
</script>

<!-- ============================================================
     POPRAWKA WIZUALNA — WYŚRODKOWANIE NAWIGACJI (Produkt/Opinie/FAQ)
     Szuka elementów z dokładnym tekstem "PRODUKT", "OPINIE", "FAQ"
     (bez rozróżniania wielkości liter), znajduje ich najbliższy
     wspólny kontener i wymusza jego wyśrodkowanie przez flexbox.
============================================================ -->
<script>
(function () {
  const NAV_WORDS = ['produkt', 'opinie', 'faq'];

  function findCommonAncestor(nodes) {
    if (nodes.length === 0) return null;
    let ancestor = nodes[0].parentElement;
    while (ancestor) {
      if (nodes.every((n) => ancestor.contains(n))) return ancestor;
      ancestor = ancestor.parentElement;
    }
    return null;
  }

  function centerNav() {
    if (document.body.dataset.mogNavCentered) return;

    const matches = [];
    document.querySelectorAll('a, button, span, div, li').forEach((el) => {
      if (el.children.length !== 0) return;
      if (el.closest('[id*="injected"]') || el.closest('[class*="injected"]')) return;
      const txt = el.textContent.trim().toLowerCase();
      if (NAV_WORDS.includes(txt)) matches.push(el.closest('a, button') || el);
    });

    if (matches.length < 3) return; // czekamy aż React wyrenderuje wszystkie 3 linki

    const container = findCommonAncestor(matches);
    if (!container) return;

    container.classList.add('mog-nav-center-injected');
    document.body.dataset.mogNavCentered = 'true';
    console.log('Wyśrodkowano nawigację, kontener:', container, 'klasa/id:', container.className, container.id);
  }

  const navCenterInterval = setInterval(centerNav, 400);
  setTimeout(() => clearInterval(navCenterInterval), 9000);
})();
</script>
