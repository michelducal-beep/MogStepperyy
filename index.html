<!-- ============ OFFSET PASKA PROMO WZGLĘDEM HEADERA (wersja bezpieczna) ============ -->
<!-- NAPRAWIONO: usunięto niebezpieczną heurystykę zgadywania "headera" po treści tekstowej
     (szukanie elementu zawierającego napis "MogSteppery"), która regularnie trafiała na
     przypadkowe elementy (np. sam tytuł H1) i wymuszała na nich position:sticky + wysoki
     z-index. To właśnie powodowało "zjeżdżanie"/nachodzenie nagłówka na resztę strony
     widoczne na zrzucie ekranu. Teraz skrypt działa WYŁĄCZNIE na prawdziwym <header>. -->
<script>
(function() {
  let headerEl = null;
  let headerObserver = null;

  function findHeaderEl() {
    // Działamy tylko na realnym, semantycznym <header> — bez zgadywania po tekście.
    return document.querySelector('header');
  }

  function applyOffset() {
    const bar = document.getElementById('mog-top-bar-injected');
    if (!bar) return;
    const h = bar.getBoundingClientRect().height;
    document.documentElement.style.setProperty('--mog-topbar-h', h + 'px');

    if (!headerEl || !document.body.contains(headerEl)) {
      headerEl = findHeaderEl();
      if (headerEl && 'MutationObserver' in window) {
        if (headerObserver) headerObserver.disconnect();
        headerObserver = new MutationObserver(() => forceHeaderStyle(h));
        headerObserver.observe(headerEl, { attributes: true, attributeFilter: ['style', 'class'] });
      }
    }
    if (headerEl) forceHeaderStyle(h);
  }

  function forceHeaderStyle(h) {
    if (!headerEl) return;
    headerEl.classList.add('mog-header-offset-injected');
    headerEl.style.setProperty('position', 'sticky', 'important');
    headerEl.style.setProperty('top', h + 'px', 'important');
    headerEl.style.setProperty('z-index', '9999', 'important');
  }

  let rafRunning = true;
  function rafLoop() {
    if (!rafRunning) return;
    applyOffset();
    requestAnimationFrame(rafLoop);
  }
  rafLoop();
  window.addEventListener('resize', applyOffset);
})();
</script>

<script>
(function() {
  const img_przed = "przed7cm.png";
  const img_po = "po7cm.png";

  const sliderHTML = `
  <section class="transformation-section-injected" id="injected-slider-section">
    <div class="transformation-container-injected">
      <h2 class="transformation-title-injected">Zobacz różnicę na demo</h2>
      <p class="transformation-subtitle-injected">Porównanie sylwetki bez wkładek i z MogSteppery</p>
      <div class="slider-buttons-injected">
        <button class="btn-injected" id="btn-before">Bez wkładek</button>
        <button class="btn-injected" id="btn-after">Po +7 cm</button>
      </div>
      <div class="instruction-text-injected">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Przesuń suwak, aby porównać
      </div>
      <div class="comparison-slider-injected" id="slider-root-injected">
        <div class="image-injected after-image-injected" style="background-image: url('${img_po}')"></div>
        <div class="image-injected before-image-injected" style="background-image: url('${img_przed}')"></div>
        <div class="slider-divider-injected"></div>
        <div class="slider-handle-injected"></div>
        <div class="label-injected label-before-injected">Bez wkładek</div>
        <div class="label-injected label-after-injected">Po <span class="label-highlight-injected">+7CM</span></div>
      </div>
    </div>
  </section>
  `;

  function doInjection() {
    const checkAndInject = () => {
      if (document.getElementById('injected-slider-section')) return;
      const allElements = Array.from(document.querySelectorAll('section, div'));
      let target = null;
      for (let el of allElements) {
        if (el.textContent.includes('KORZYŚCI') || el.textContent.includes('Przemyślane od początku')) {
          target = el.closest('section') || el.parentElement;
          break;
        }
      }
      if (!target) {
        const sections = document.querySelectorAll('section');
        if (sections.length > 0) {
          target = sections[Math.floor(sections.length / 2)];
        }
      }
      if (target) {
        target.insertAdjacentHTML('afterend', sliderHTML);
        setupSlider();
      }
    };
    const interval = setInterval(checkAndInject, 500);
    setTimeout(() => clearInterval(interval), 5000);
  }

  function setupSlider() {
    const s = document.getElementById('slider-root-injected');
    const btnBefore = document.getElementById('btn-before');
    const btnAfter = document.getElementById('btn-after');
    if (!s) return;

    const setPos = (p) => {
      s.style.setProperty('--slider-pos', p + '%');
      if (p >= 90) { btnBefore.classList.add('active'); btnAfter.classList.remove('active'); }
      else if (p <= 10) { btnAfter.classList.add('active'); btnBefore.classList.remove('active'); }
      else { btnBefore.classList.remove('active'); btnAfter.classList.remove('active'); }
    };

    const update = (e) => {
      const r = s.getBoundingClientRect();
      const clientX = (e.touches ? e.touches[0].clientX : e.clientX);
      let p = ((clientX - r.left) / r.width) * 100;
      p = Math.max(0, Math.min(p, 100));
      setPos(p);
    };

    const start = (e) => {
      s.classList.add('sliding');
      update(e);
      const moveHandler = (moveEvent) => { update(moveEvent); };
      const endHandler = () => {
        s.classList.remove('sliding');
        window.removeEventListener('mousemove', moveHandler);
        window.removeEventListener('mouseup', endHandler);
        window.removeEventListener('touchmove', moveHandler);
        window.removeEventListener('touchend', endHandler);
      };
      window.addEventListener('mousemove', moveHandler);
      window.addEventListener('mouseup', endHandler);
      window.addEventListener('touchmove', moveHandler, { passive: false });
      window.addEventListener('touchend', endHandler);
    };

    s.addEventListener('mousedown', start);
    s.addEventListener('touchstart', (e) => { e.preventDefault(); start(e); }, { passive: false });
    btnBefore.addEventListener('click', () => setPos(100));
    btnAfter.addEventListener('click', () => setPos(0));
    setPos(50);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', doInjection);
  } else {
    doInjection();
  }
})();
</script>

<!-- ============ GLOBALNA PODMIANA CENY 59,99 / 59 zł -> 69,99 zł (bez limitu czasowego) ============ -->
<script>
(function() {
  const OLD_PRICE_RE = /59(?:[.,]99)?\s*zł/gi;

  function replacePricesInTree(root) {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    const nodes = [];
    let n;
    while ((n = walker.nextNode())) {
      if (n.parentElement && n.parentElement.closest('[id*="injected"], [class*="injected"], script, style')) continue;
      if (OLD_PRICE_RE.test(n.nodeValue)) nodes.push(n);
      OLD_PRICE_RE.lastIndex = 0;
    }
    nodes.forEach((node) => {
      node.nodeValue = node.nodeValue.replace(OLD_PRICE_RE, '69,99 zł');
    });
  }

  function runPriceSync() {
    replacePricesInTree(document.body);
  }

  runPriceSync();
  const root = document.getElementById('root');
  if (root && 'MutationObserver' in window) {
    const mo = new MutationObserver(() => runPriceSync());
    mo.observe(root, { childList: true, subtree: true, characterData: true });
  }
})();
</script>

  function insertChain() {
    const slider = document.getElementById('injected-slider-section');
    if (!slider) return;

    if (!document.getElementById('cro-comparison-section-injected')) {
      slider.insertAdjacentHTML('beforebegin', compareHTML);
    }
    if (!document.getElementById('cro-benefits-detail-injected')) {
      slider.insertAdjacentHTML('beforebegin', benefitsDetailHTML);
    }
    if (!document.getElementById('cro-lifestyle-injected')) {
      slider.insertAdjacentHTML('beforebegin', lifestyleHTML);
    }
    if (!document.getElementById('cro-size-info-injected')) {
      slider.insertAdjacentHTML('beforebegin', sizeInfoHTML);
    }
    if (!document.getElementById('cro-testimonials-injected')) {
      slider.insertAdjacentHTML('afterend', testimonialsHTML);
    }
  }

  const chainInterval = setInterval(insertChain, 500);
  setTimeout(() => clearInterval(chainInterval), 8000);

  const NATIVE_PANEL_LABELS = ['TECHNOLOGIA', 'KORZYŚCI', 'PRODUKT', 'OPINIE'];
  window.__mogNativeImages = window.__mogNativeImages || {};

  function findImageInBlock(block) {
    if (!block) return null;
    const img = block.querySelector('img');
    if (img && img.src) return img.src;
    const all = block.querySelectorAll('*');
    for (const node of all) {
      const bg = getComputedStyle(node).backgroundImage;
      if (bg && bg !== 'none') {
        const m = bg.match(/url\(["']?(.*?)["']?\)/);
        if (m && m[1]) return m[1];
      }
    }
    return null;
  }

  function getBlockAncestor(el) {
    let node = el;
    let depth = 0;
    while (node && node.parentElement && depth < 12) {
      node = node.parentElement;
      depth++;
      if (node.tagName === 'SECTION') return node;
      if (node.parentElement && (node.parentElement.id === 'root' || node.parentElement.tagName === 'BODY' || node.parentElement.tagName === 'MAIN')) {
        return node;
      }
    }
    return el.parentElement;
  }

  // NAPRAWIONO: to była najgroźniejsza funkcja w całym pliku i główna przyczyna
  // zniknięcia paneli ("zostały same napisy"). Wcześniej KAŻDY pojedynczy element
  // (span/div/p/h1-h5) zawierający dokładnie słowo "PRODUKT" albo "OPINIE" — a takie
  // słowa bardzo często występują też jako linki w menu/nawigacji! — powodował ukrycie
  // (display:none) całego rodzica-sekcji, nawet jeśli to był fragment nagłówka/nawigacji,
  // a nie prawdziwy panel z obrazkiem. Teraz:
  //  1) pomijamy elementy wewnątrz <header>/<nav>/<footer>,
  //  2) ukrywamy blok WYŁĄCZNIE, jeśli faktycznie zawiera obrazek/tło (czyli faktycznie
  //     jest tym natywnym panelem z grafiką, który chcieliśmy zduplikować, a nie linkiem).
  function hideNativeDuplicateSections() {
    const candidates = document.querySelectorAll('span, div, p, h1, h2, h3, h4, h5');
    candidates.forEach((el) => {
      if (el.children.length !== 0) return;
      if (el.closest('[id*="injected"]') || el.closest('[class*="injected"]')) return;
      if (el.closest('header, nav, footer')) return;
      const txt = el.textContent.trim().toUpperCase();
      if (!NATIVE_PANEL_LABELS.includes(txt)) return;
      const block = getBlockAncestor(el);
      if (!block || block.dataset.mogHiddenByInjected) return;
      if (block.closest('header, nav, footer')) return;
      const imgUrl = findImageInBlock(block);
      if (!imgUrl) return;
      window.__mogNativeImages[txt] = imgUrl;
      block.dataset.mogHiddenByInjected = 'true';
      block.style.display = 'none';
    });
  }

  const hideNativeInterval = setInterval(hideNativeDuplicateSections, 500);
  setTimeout(() => clearInterval(hideNativeInterval), 9000);

  function fillCapturedVisuals() {
    const techUrl = window.__mogNativeImages['TECHNOLOGIA'];
    const techSlot = document.getElementById('cro-tech-visual-slot-injected');
    if (techUrl && techSlot && !techSlot.dataset.filled) {
      techSlot.innerHTML = `<img src="${techUrl}" alt="Warstwy MogSteppery — regulacja 3-7 cm" loading="lazy" />`;
      techSlot.style.display = 'block';
      techSlot.dataset.filled = 'true';
    }
    const prodUrl = window.__mogNativeImages['PRODUKT'];
    const prodSlot = document.getElementById('cro-product-visual-slot-injected');
    if (prodUrl && prodSlot && !prodSlot.dataset.filled) {
      prodSlot.innerHTML = `<img src="${prodUrl}" alt="Wkładka MogSteppery" loading="lazy" />`;
      prodSlot.style.display = 'block';
      prodSlot.dataset.filled = 'true';
    }
  }

  const fillVisualsInterval = setInterval(fillCapturedVisuals, 500);
  setTimeout(() => clearInterval(fillVisualsInterval), 10000);

  const NAV_TARGETS = [
    { match: /^opinie$/i, targetId: 'cro-testimonials-injected' },
    { match: /^produkt$/i, targetId: 'cro-size-info-injected' },
  ];

  function bindNavLinks() {
    const candidates = document.querySelectorAll('a, button, span, div, li');
    candidates.forEach((el) => {
      if (el.children.length !== 0) return;
      if (el.closest('[id*="injected"]') || el.closest('[class*="injected"]')) return;
      if (el.dataset.mogNavBound) return;
      const txt = el.textContent.trim();
      const rule = NAV_TARGETS.find(r => r.match.test(txt));
      if (!rule) return;

      const clickableEl = el.closest('a, button') || el;
      clickableEl.classList.add('mog-nav-bound-injected');
      el.dataset.mogNavBound = 'true';
      clickableEl.addEventListener('click', (e) => {
        const target = document.getElementById(rule.targetId);
        if (target) {
          e.preventDefault();
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });
    });
  }

  const navBindInterval = setInterval(bindNavLinks, 500);
  setTimeout(() => clearInterval(navBindInterval), 9000);

})();
</script>

  function findNativeBuyCard() {
    const shopifyButton = document.querySelector('.shopify-buy-button');

    let node = shopifyButton;

    for (let i = 0; i < 12; i++) {
      if (!node.parentElement) break;

      const parent = node.parentElement;

      if (
        parent.id === 'root' ||
        parent.tagName === 'BODY' ||
        parent.tagName === 'MAIN'
      ) {
        break;
      }

      const rect = parent.getBoundingClientRect();

      const isWholeHero =
        rect.width >= window.innerWidth * 0.9 &&
        rect.height >= window.innerHeight * 0.7;

      if (!isWholeHero) {
        bestCard = parent;

      node = parent;

      healTimeout = setTimeout(insertPurchaseBlock, 150);
    });
    observer.observe(root, { childList: true, subtree: true });
  }

  function bindSelector() {
    const wrap = document.getElementById('mog-selector-wrap-injected');
    const buyBtn = document.getElementById('buyBtn');
    if (!wrap || wrap.dataset.bound) return;
    wrap.dataset.bound = 'true';
    const opts = wrap.querySelectorAll('.mog-option-injected');
    opts.forEach((opt) => {
      opt.addEventListener('click', () => {
        opts.forEach((o) => o.classList.remove('mog-active-injected'));
        opt.classList.add('mog-active-injected');
        const label = opt.getAttribute('data-option') === 'double' ? '99,99 zł' : '69,99 zł';
        if (buyBtn) buyBtn.textContent = 'Kup teraz — ' + label;
      });
    });

    if (buyBtn) {
      buyBtn.addEventListener('click', () => {
        console.log('Przejście do zakupu:', buyBtn.textContent);
      });
    }
  }

  function initStockCounter() {
    const el = document.getElementById('mog-stock-count-injected');
    if (!el || el.dataset.bound) return;
    el.dataset.bound = 'true';
    let count = parseInt(sessionStorage.getItem('mogStockCount') || '', 10);
    if (!count || isNaN(count)) {
      count = 12 + Math.floor(Math.random() * 4);
    }
    el.textContent = count;
    sessionStorage.setItem('mogStockCount', count);
    setInterval(() => {
      if (count > 6) {
        count -= 1;
        el.textContent = count;
        sessionStorage.setItem('mogStockCount', count);
      }
    }, 45000 + Math.random() * 30000);
  }

  const purchaseInterval = setInterval(insertPurchaseBlock, 500);
  setTimeout(() => clearInterval(purchaseInterval), 12000);
  watchAndHeal();

})();
</script>

<script>
(function() {

  const MOG_TOASTS = [
    { name: 'Kacper', city: 'Warszawy', product: 'pakiet 2 par' },
    { name: 'Bartek', city: 'Krakowa', product: 'pojedynczą parę' },
    { name: 'Zuzia', city: 'Wrocławia', product: 'pakiet 2 par' },
    { name: 'Dawid', city: 'Poznania', product: 'pojedynczą parę' },
    { name: 'Mateusz', city: 'Gdańska', product: 'pakiet 2 par' },
    { name: 'Marta', city: 'Łodzi', product: 'pojedynczą parę' },
    { name: 'Kuba', city: 'Katowic', product: 'pakiet 2 par' },
    { name: 'Ola', city: 'Szczecina', product: 'pojedynczą parę' },
    { name: 'Michał', city: 'Lublina', product: 'pakiet 2 par' },
    { name: 'Ania', city: 'Bydgoszczy', product: 'pojedynczą parę' }
  ];

  function ensureToastContainer() {
    if (document.getElementById('mog-toast-container-injected')) return;
    document.body.insertAdjacentHTML('beforeend', '<div id="mog-toast-container-injected"></div>');
  }

  function showRandomToast() {
    ensureToastContainer();
    const container = document.getElementById('mog-toast-container-injected');
    if (!container) return;
    const data = MOG_TOASTS[Math.floor(Math.random() * MOG_TOASTS.length)];
    const initials = data.name.charAt(0);

    const toast = document.createElement('div');
    toast.className = 'mog-toast-injected';
    toast.style.position = 'relative';
    toast.innerHTML = `
      <div class="mog-toast-avatar-injected">${initials}</div>
      <div>
        <div class="mog-toast-text-injected"><b>${data.name}</b> z ${data.city} właśnie zamówił ${data.product}</div>
        <div class="mog-toast-time-injected">przed chwilą</div>
      </div>
      <button class="mog-toast-close-injected" aria-label="Zamknij">✕</button>
    `;
    container.appendChild(toast);
    requestAnimationFrame(() => toast.classList.add('mog-toast-show-injected'));

    const removeToast = () => {
      toast.classList.remove('mog-toast-show-injected');
      setTimeout(() => toast.remove(), 400);
    };
    const autoHide = setTimeout(removeToast, 4800);
    toast.querySelector('.mog-toast-close-injected').addEventListener('click', () => {
      clearTimeout(autoHide);
      removeToast();
    });
  }

  function loopToasts() {
    const tick = () => {
      showRandomToast();
      setTimeout(tick, 9000 + Math.random() * 9000);
    };
    setTimeout(tick, 5000);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loopToasts);
  } else {
    loopToasts();
  }

})();
</script>
