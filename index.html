<!-- ============================================================
     RDZEŃ: odporny mechanizm wstrzykiwania (zastępuje wszystkie
     poprzednie setInterval + setTimeout(clearInterval, Xms)).

     Dlaczego to było zepsute: każda sekcja czekała max. 5-9s na
     wyrenderowanie się elementu Reacta, a potem interval był
     ubijany NA ZAWSZE. Jeśli React (duże pliki wideo, wolniejsze
     łącze) renderował się dłużej niż ten limit - sekcja znikała
     bezpowrotnie. Stąd widoczna była tylko stopka/legal-bar, bo
     te dwie rzeczy jako jedyne wstawiają się bezwarunkowo.

     Nowe podejście:
     1) MutationObserver realnie czeka, aż element się pojawi
        (żadnego sztywnego "poddaję się po 5s").
     2) Twardy limit czasu jest znacznie dłuższy (20s) TYLKO jako
        zabezpieczenie przed nieskończonym czekaniem.
     3) Jeśli mimo wszystko po 20s nic nie znaleziono - sekcja i
        tak wstawia się w bezpiecznym, gwarantowanym miejscu
        (koniec <body>), zamiast znikać na zawsze.
============================================================ -->
<script>
(function () {

  // Czeka aż finder() zwróci coś "prawdziwego", albo do upływu timeout.
  // Zwraca Promise<element|null>.
  function waitFor(finder, timeout) {
    timeout = timeout || 20000;
    return new Promise(function (resolve) {
      var found = finder();
      if (found) { resolve(found); return; }

      var settled = false;
      var obs = new MutationObserver(function () {
        if (settled) return;
        var f = finder();
        if (f) {
          settled = true;
          obs.disconnect();
          clearTimeout(timer);
          resolve(f);
        }
      });
      obs.observe(document.body, { childList: true, subtree: true, characterData: true });

      var timer = setTimeout(function () {
        if (settled) return;
        settled = true;
        obs.disconnect();
        resolve(null); // brak wyniku - kod wywołujący MUSI mieć fallback
      }, timeout);
    });
  }

  window.__mogFindAnchor = function () {
    var allElements = Array.prototype.slice.call(document.querySelectorAll('section, div'));
    for (var i = 0; i < allElements.length; i++) {
      var el = allElements[i];
      var txt = el.textContent || '';
      if (txt.indexOf('KORZYŚCI') !== -1 || txt.indexOf('Przemyślane od początku') !== -1) {
        return el.closest('section') || el.parentElement;
      }
    }
    var sections = document.querySelectorAll('section');
    if (sections.length > 0) return sections[Math.floor(sections.length / 2)];
    return null;
  };

  window.__mogWaitFor = waitFor;

<script>
(function() {
  const img_przed = "przed7cm.png";
  const img_po = "po7cm.png";

  const sliderHTML = `
  <section class="transformation-section-injected" id="injected-slider-section">
    <div class="transformation-container-injected">
      <h2 class="transformation-title-injected">Zobacz różnicę na demo</h2>
      <p class="transformation-subtitle-injected">Porównanie sylwetki bez wkładek i z MogSteppery</p>
      <div class="slider-buttons-injected">
        <button class="btn-injected" id="btn-before">Bez wkładek</button>
        <button class="btn-injected" id="btn-after">Po +7 cm</button>
      </div>
      <div class="instruction-text-injected">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Przesuń suwak, aby porównać
      </div>
      <div class="comparison-slider-injected" id="slider-root-injected">
        <div class="image-injected after-image-injected" style="background-image: url('${img_po}')"></div>
        <div class="image-injected before-image-injected" style="background-image: url('${img_przed}')"></div>
        <div class="slider-divider-injected"></div>
        <div class="slider-handle-injected"></div>
        <div class="label-injected label-before-injected">Bez wkładek</div>
        <div class="label-injected label-after-injected">Po <span class="label-highlight-injected">+7CM</span></div>
      </div>
    </div>
  </section>
  `;

  async function doInjection() {
    if (document.getElementById('injected-slider-section')) return;
    const target = await window.__mogWaitFor(window.__mogFindAnchor, 20000);
    if (target) {
      target.insertAdjacentHTML('afterend', sliderHTML);
    } else {
      // Fallback: nie znaleziono zaczepienia w Reactcie - wstaw i tak,
      // zamiast tracić całą sekcję bezpowrotnie.
      document.body.insertAdjacentHTML('beforeend', sliderHTML);
    }
    setupSlider();
  }

  function setupSlider() {
    const s = document.getElementById('slider-root-injected');
    const btnBefore = document.getElementById('btn-before');
    const btnAfter = document.getElementById('btn-after');
    if (!s) return;

    const setPos = (p) => {
      s.style.setProperty('--slider-pos', p + '%');
      if (p >= 90) { btnBefore.classList.add('active'); btnAfter.classList.remove('active'); }
      else if (p <= 10) { btnAfter.classList.add('active'); btnBefore.classList.remove('active'); }
      else { btnBefore.classList.remove('active'); btnAfter.classList.remove('active'); }
    };

    const update = (e) => {
      const r = s.getBoundingClientRect();
      const clientX = (e.touches ? e.touches[0].clientX : e.clientX);
      let p = ((clientX - r.left) / r.width) * 100;
      p = Math.max(0, Math.min(p, 100));
      setPos(p);
    };

    const start = (e) => {
      s.classList.add('sliding');
      update(e);
      const moveHandler = (moveEvent) => { update(moveEvent); };
      const endHandler = () => {
        s.classList.remove('sliding');
        window.removeEventListener('mousemove', moveHandler);
        window.removeEventListener('mouseup', endHandler);
        window.removeEventListener('touchmove', moveHandler);
        window.removeEventListener('touchend', endHandler);
      };
      window.addEventListener('mousemove', moveHandler);
      window.addEventListener('mouseup', endHandler);
      window.addEventListener('touchmove', moveHandler, { passive: false });
      window.addEventListener('touchend', endHandler);
    };

    s.addEventListener('mousedown', start);
    s.addEventListener('touchstart', (e) => { e.preventDefault(); start(e); }, { passive: false });
    btnBefore.addEventListener('click', () => setPos(100));
    btnAfter.addEventListener('click', () => setPos(0));
    setPos(50);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', doInjection);
  } else {
    doInjection();
  }
})();
</script>

        <p>Jeśli otrzymany towar jest wadliwy lub niezgodny z opisem, napisz do nas na <a href="mailto:${SELLER.email}">${SELLER.email}</a>, opisując problem i załączając zdjęcia (jeśli to możliwe). Reklamację rozpatrujemy w ciągu 14 dni od jej otrzymania.</p>
      `
    },
    dane: {
      title: "Dane sprzedawcy",
      html: `
        <h3>${SELLER.wlasciciel}</h3>
        <p style="color:var(--text-gray); font-size:12.5px; margin-top:-4px;">${SELLER.forma} pod nazwą <strong style="color:var(--text-light)">${SELLER.firma}</strong></p>
        <p><strong>Adres:</strong> ${SELLER.adres}</p>
        <p><strong>NIP:</strong> ${SELLER.nip} &nbsp;|&nbsp; <strong>REGON:</strong> ${SELLER.regon}</p>
        <p><strong>E-mail:</strong> <a href="mailto:${SELLER.email}">${SELLER.email}</a></p>
        <p><strong>Telefon:</strong> <a href="tel:${SELLER.telefon.replace(/\s/g,'')}">${SELLER.telefon}</a></p>
      `
    }
  };

  function openDoc(key) {
    const doc = DOCS[key];
    if (!doc) return;
    const content = document.getElementById('injected-legal-content');
    content.innerHTML = `<h2>${doc.title}</h2>${doc.html}`;
    document.getElementById('injected-legal-overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeDoc() {
    document.getElementById('injected-legal-overlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  function ensureOverlay() {
    if (document.getElementById('injected-legal-overlay')) return;
    document.body.insertAdjacentHTML('beforeend', overlayHTML);
    document.getElementById('injected-legal-close').addEventListener('click', closeDoc);
    document.getElementById('injected-legal-overlay').addEventListener('click', (e) => {
      if (e.target.id === 'injected-legal-overlay') closeDoc();
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDoc(); });
  }

  function addSellerTrustAndLegalBar() {
    if (!document.getElementById('injected-seller-trust')) {
      document.body.insertAdjacentHTML('beforeend', sellerTrustHTML);
    }
    if (!document.getElementById('injected-legal-bar')) {
      const barHTML = `
      <div id="injected-legal-bar">
        <button class="legal-extra-link-injected" data-doc="regulamin">Regulamin sklepu</button>
        <button class="legal-extra-link-injected" data-doc="prywatnosc">Polityka prywatności</button>
        <button class="legal-extra-link-injected" data-doc="cookies">Polityka cookies</button>
        <button class="legal-extra-link-injected" data-doc="zwroty">Zwroty i reklamacje</button>
        <button class="legal-extra-link-injected" data-doc="dane">Pełne dane sprzedawcy</button>
      </div>`;
      document.body.insertAdjacentHTML('beforeend', barHTML);
      document.querySelectorAll('#injected-legal-bar .legal-extra-link-injected').forEach(btn => {
        btn.addEventListener('click', () => openDoc(btn.getAttribute('data-doc')));
      });
    }
  }

  function inject() {
    ensureOverlay();
    addSellerTrustAndLegalBar();
  }

  inject();
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', inject);
  }
  window.addEventListener('load', inject);

  // Dane sprzedawcy + pasek prawny mają być ZAWSZE na samym dole strony,
  // nawet jeśli inne wstrzykiwane sekcje (tabela, opinie itp.) doklejają
  // się później i normalnie "spychałyby" je w górę kolejności.
  function pinFooterToBottom() {
    const seller = document.getElementById('injected-seller-trust');
    const bar = document.getElementById('injected-legal-bar');
    if (!seller && !bar) return;
    const last = document.body.lastElementChild;
    if (bar && last !== bar) {
      if (seller) document.body.appendChild(seller);
      document.body.appendChild(bar);
    } else if (!bar && seller && last !== seller) {
      document.body.appendChild(seller);
    }
  }
  const footerPinObserver = new MutationObserver(() => pinFooterToBottom());
  footerPinObserver.observe(document.body, { childList: true });
})();
</script>

<!-- ============ CZYSZCZENIE STARYCH SEKCJI + POPRAWKI HERO ============ -->
<script>
(function() {

  function fixHeroHeadline() {
    const h1 = document.querySelector('h1');
    if (h1 && !h1.classList.contains('hero-headline-fixed-injected')) {
      h1.classList.add('hero-headline-fixed-injected');
    }
  }

  const OLD_SECTION_MARKERS = [
    'Warstwy, które',
    'Przemyślane od początku',
    'Klienci mówią'
  ];

  function removeOldSections() {
    const candidates = Array.from(document.querySelectorAll('section, div'));
    OLD_SECTION_MARKERS.forEach((marker) => {
      for (let el of candidates) {
        if (el.id && el.id.includes('injected')) continue;
        if (el.closest && el.closest('[id*="injected"]')) continue;
        if (el.textContent.includes(marker)) {
          const section = el.closest('section') || el;
          if (section && section.dataset.removedInjected !== '1') {
            section.dataset.removedInjected = '1';
            section.style.display = 'none';
          }
          break;
        }
      }
    });
  }

  function relocateCtaBoost() {
    const boost = document.getElementById('cro-cta-boost-injected');
    if (!boost || boost.dataset.relocated === '1') return;

    const all = Array.from(document.querySelectorAll('section, div, p, span'));
    let priceAnchor = null;
    for (let el of all) {
      if (el.closest && el.closest('[id*="injected"]')) continue;
      if (/Wysyłka InPost/i.test(el.textContent) && el.textContent.length < 60) {
        priceAnchor = el;
        break;
      }
    }
    if (priceAnchor) {
      const container = priceAnchor.closest('div') || priceAnchor.parentElement;
      container.insertAdjacentElement('afterend', boost);
      boost.dataset.relocated = '1';
      boost.style.marginTop = '28px';
    }
  }

  function runAll() {
    fixHeroHeadline();
    removeOldSections();
    relocateCtaBoost();
  }

  runAll();
  // Zamiast ubijać po 9s, obserwujemy stale - koszt znikomy, a strona
  // zawsze pozostaje spójna, niezależnie od tego jak długo ładuje się React.
  const cleanupObserver = new MutationObserver(() => runAll());
  cleanupObserver.observe(document.body, { childList: true, subtree: true, characterData: true });

})();
</script>
